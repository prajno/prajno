<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
{{meta}}
<script>
  // The cold-open is armed here, before first paint, so a page that is about to animate
  // never flashes its finished state first. Two decisions, recorded as root classes:
  //   .home   this page can run the intro at all — the top-level home page (articles live
  //           under /articles/, and peek inside iframes), JS present by definition, and
  //           motion not turned down. site/js/intro.js does nothing without it.
  //   .intro  it should run right now — this visitor hasn't loaded the site in an hour.
  (function () {
    var root = document.documentElement;
    if (/\/articles\//.test(location.pathname) || window.self !== window.top) return;
    if (!matchMedia("(prefers-reduced-motion: no-preference)").matches) return;
    root.classList.add("home");
    var KEY = "prajno.lastVisit", HOUR = 60 * 60 * 1000, now = Date.now(), last = 0;
    try {
      last = Number(localStorage.getItem(KEY)) || 0;
      localStorage.setItem(KEY, String(now));
    } catch (e) { /* storage walled off (private mode) — treat every load as the first */ }
    if (now - last < HOUR) return;   // seen recently: land on the finished page instead
    root.classList.add("intro");
    // Safety valve: if the typing sequence never boots (a script error, an ancient
    // browser), un-hide the static page instead of leaving it blank.
    setTimeout(function () {
      if (!root.classList.contains("boot")) root.classList.remove("intro");
    }, 1500);
  })();
</script>
<script src="{{root}}js/intro.js" defer></script>
<style>
  /* ————— prajno.com design system: "Drafting Room" ————————————————————————
     Deep-olive ground, chartreuse accent, condensed display caps over a grid of
     hairlines. Single theme, deliberately. Fonts are self-hosted (site/fonts). */
  @font-face {
    font-family: "Big Shoulders Display";
    src: url("{{root}}fonts/big-shoulders-display-var.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Archivo";
    src: url("{{root}}fonts/archivo-var.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("{{root}}fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("{{root}}fonts/ibm-plex-mono-500.woff2") format("woff2");
    font-weight: 500; font-display: swap;
  }

  :root {
    --ground: #171a12;
    --surface: #1e2316;
    --raised: #262c1c;
    --hairline: #39412a;
    --text: #e9e7da;
    --muted: #a2a68c;
    --accent: #bcd36c;
    --accent-dim: #74814d;
    --tint: rgb(12 14 8 / 0.7);
    --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --font-body: "Archivo", -apple-system, "Segoe UI", sans-serif;
    --font-label: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --radius: 2px;
  }

  * { box-sizing: border-box; }
  body { margin: 0 0 60px; background: var(--ground); color: var(--text);
         font-family: var(--font-body); font-size: 17px; line-height: 1.65;
         overflow-x: hidden; }
  main { max-width: 700px; margin: 0 auto; padding: 0 20px; }

  h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em;
       text-transform: uppercase; font-size: clamp(24px, 7vw, 30px); margin-top: 44px; }
  a { color: var(--accent); }
  blockquote { border-left: 3px solid var(--accent-dim); margin-left: 0; padding-left: 20px;
               font-style: italic; color: var(--muted); }
  blockquote p { margin: 0; }
  figure { margin: 32px 0; }
  img { max-width: 100%; border-radius: var(--radius); }
  figcaption { font-size: 13.5px; color: var(--muted); text-align: center; margin-top: 8px;
               font-family: var(--font-label); }
  code { font-family: var(--font-label); font-size: 15px; background: var(--raised);
         border: 1px solid var(--hairline); padding: 1px 6px; border-radius: 4px; }
  /* body clips horizontal overflow, so wide content must scroll inside its own box */
  pre { overflow-x: auto; }
  table { display: block; overflow-x: auto; }

  /* ————— pinned header ————— */
  .site-header { position: sticky; top: 0; z-index: 50;
                 width: 100vw; margin-left: calc(50% - 50vw);
                 background: color-mix(in srgb, var(--ground) 92%, transparent);
                 backdrop-filter: blur(6px);
                 border-bottom: 1px solid var(--hairline); }
  /* position: relative anchors the replay control to the header's top right corner */
  .site-header .inner { position: relative; max-width: 1100px; margin: 0 auto;
                        padding: 20px 32px 16px; }
  .site-header h1 { margin: 0; font-family: var(--font-display); font-weight: 700;
                    font-size: clamp(32px, 9vw, 44px); line-height: 0.98; letter-spacing: 0.01em;
                    text-transform: uppercase; }
  .site-header h1 .dot, .site-header h1 + .subtitle b { color: var(--accent); }
  .site-header h1 .tld { text-transform: none; } /* the lowercase "com" survives the caps */
  .site-header .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 16.5px; }

  /* ————— article accordions ————— */
  /* Accordions run the full viewport width — only the pinned header is exempt. */
  .articles { width: 100vw; margin-left: calc(50% - 50vw); }
  .articles .inner { padding: 0 16px; }
  .list-label { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 30px 0 0;
                font-family: var(--font-label); font-size: 12px; letter-spacing: 0.22em;
                text-transform: uppercase; color: var(--accent); }
  /* min-width keeps the hairline from being starved to 0 by a long label — it wraps to a
     full-width rule below the text instead */
  .list-label::after { content: ""; flex: 1; min-width: 48px; height: 1px; background: var(--hairline); }
  /* the Archive section sits apart from the series above it */
  .list-label.archive { margin-top: 76px; }

  .acc { margin: 22px 0; }
  .acc-inner { border: 1px solid var(--hairline); border-radius: var(--radius);
               overflow: hidden; background: var(--surface); }
  .acc-bar { display: flex; align-items: center; gap: 16px; padding: 16px 22px; }
  .chev { flex: none; width: 20px; height: 20px; color: var(--accent);
          background: none; border: 0; padding: 0; cursor: pointer; }
  .chev svg { display: block; width: 100%; height: 100%;
              transition: transform 0.22s ease; }
  .acc.open .chev svg { transform: rotate(90deg); }
  .acc-toggle { flex: 1; text-align: left; background: none; border: 0; cursor: pointer;
                padding: 4px 0; font: inherit; color: inherit; }
  .acc-title { display: block; font-family: var(--font-display); font-weight: 600;
               font-size: clamp(21px, 5.6vw, 27px); line-height: 1.08; letter-spacing: 0.01em;
               text-transform: uppercase; }
  .acc-toggle:hover .acc-title, .ext .acc-link:hover .acc-title { color: var(--accent); }
  .acc-meta { display: block; color: var(--muted); font-size: 14.5px; margin-top: 5px; }
  .acc-open { display: flex; align-items: center; gap: 8px; text-decoration: none;
              color: var(--text); font-size: 19px; padding: 6px 4px; border-radius: 6px; }
  .acc-open .tip { font-family: var(--font-label); font-size: 12px; letter-spacing: 0.04em;
                   color: var(--muted); border: 1px solid var(--hairline); background: var(--raised);
                   border-radius: 999px; padding: 4px 12px; opacity: 0; transform: translateX(6px);
                   transition: opacity 0.18s, transform 0.18s; white-space: nowrap; }
  .acc-open:hover .tip, .acc-open:focus-visible .tip { opacity: 1; transform: none; }
  .acc-open:hover, .acc-open:focus-visible { color: var(--accent); }
  /* The hidden tip still occupies flex space; drop it where it can't reveal or fit. */
  @media (hover: none), (max-width: 639px) { .acc-open .tip { display: none; } }

  /* panel: iframe peek behind a tint, hinged open a few degrees on hover */
  .acc-panel { position: relative; height: 380px; overflow: hidden;
               border-top: 1px solid var(--hairline);
               transition: height 0.35s ease; perspective: 900px; }
  .acc.open .acc-panel { height: calc(100vh - var(--header-h, 92px) - var(--bar-h, 78px));
                         height: calc(100dvh - var(--header-h, 92px) - var(--bar-h, 78px)); }
  .acc-tilt { position: absolute; inset: 0; transition: transform 0.25s ease;
              transform-origin: top center; }
  .acc-panel iframe { display: block; width: 100%; height: 100%; border: 0; background: #141021; }
  .acc-shield { position: absolute; inset: 0; cursor: pointer; background: var(--tint);
                transition: opacity 0.25s ease; }
  html:not(.js) .acc-shield { display: none; }
  .acc:not(.open):hover .acc-shield { opacity: 0; }
  .acc:not(.open):hover .acc-tilt { transform: rotateX(-4deg); }
  .acc.open .acc-shield { display: none; }
  .acc.open .acc-tilt { transform: none; }

  /* external card variant (e.g. Medium): no expand/collapse — the whole card links out */
  .ext .acc-link { display: block; color: inherit; text-decoration: none; }
  .ext .acc-bar { padding-right: 22px; }
  .ext .acc-panel { height: auto; perspective: none; }
  .ext-body { position: relative; display: grid; grid-template-columns: 1.5fr 1fr; gap: 26px;
              padding: 22px 26px 24px; }
  .ext-body p { margin: 0 0 14px; max-width: 60ch; font-size: 15.5px; }
  .ext-body p:last-of-type { margin-bottom: 10px; }
  .ext-more { font-family: var(--font-label); font-size: 12.5px; letter-spacing: 0.06em;
              color: var(--accent); }
  .ext-img { align-self: start; border: 1px solid var(--hairline); border-radius: var(--radius);
             overflow: hidden; }
  .ext-img img { width: 100%; height: 210px; object-fit: cover; display: block; border-radius: 0; }
  .ext .acc-shield { cursor: inherit; }
  .ext .acc-link:hover .acc-shield { opacity: 0; }
  /* ————— viewport convention: Tailwind-aligned, desktop-base, max-width direction.
     below md (767px) — structural changes; below sm (639px) — compact phone spacing.
     Display type is fluid via clamp() and never steps at a breakpoint. lg/xl need no
     rules (main caps at 700px). Don't invent new widths here; a per-article template
     may carry its own scoped breakpoints. ————— */
  @media (max-width: 767px) {
    .ext-body { grid-template-columns: 1fr; gap: 18px; padding: 18px 18px 20px; }
    .ext-img img { height: 150px; }
  }
  @media (max-width: 639px) {
    .site-header .inner { padding: 14px 20px 12px; }
    .site-header .subtitle { font-size: 15px; }
    main { padding: 0 16px; }
    .articles .inner { padding: 0 12px; }
    .acc { margin: 16px 0; }
    .acc-bar { padding: 12px 14px; gap: 10px; }
    .acc-meta { font-size: 13.5px; margin-top: 3px; }
    .acc-open { padding: 8px 10px; }  /* bigger tap target now the tip is gone */
    .acc-panel { height: min(380px, 45vh); height: min(380px, 45dvh); }
  }

  /* ————— load sequence: a terminal cold-open —————
     The head script arms the root classes before first paint; site/js/intro.js types
     "Welcome to my website…", deletes it, types the title, and hands over to .pin.
     Four classes describe the whole thing:

       .home    this page may run an intro (and may offer to replay it)
       .intro   the intro owns the page — header parked mid-viewport, subtitle and list held
       .boot    the terminal line is mounted, so the header's contents may show
       .pin     the finished state — header up top, subtitle and list cascaded in
       .rewind  the same journey playing backwards, from the replay control

     Every step is a TRANSITION between those states, never a keyframe animation. That is
     what makes the replay possible: a transition plays in whichever direction the class
     went, and adding .pin to a page that is already settled (what a replay does before it
     rewinds anything) is a no-op rather than a re-entry. Any interaction skips to .pin. */
  html.intro .site-header { transform: translateY(calc(50vh - 100%));
                            border-color: transparent; background: transparent;
                            backdrop-filter: none; }
  html.intro .site-header .inner { opacity: 0; }      /* until the terminal line is prepared */
  html.intro.boot .site-header .inner { opacity: 1; }
  .site-header { transition: transform 0.55s cubic-bezier(0.22, 0.9, 0.3, 1),
                             background 0.3s, border-color 0.3s; }
  html.intro.pin .site-header { transform: none; border-color: var(--hairline);
                                background: color-mix(in srgb, var(--ground) 92%, transparent);
                                backdrop-filter: blur(6px); }
  /* rewinding, the list clears out first and the header follows it back down */
  html.intro.rewind .site-header { transition-delay: 0.5s; }

  html.intro .subtitle { opacity: 0; }
  .subtitle { transition: opacity 0.3s ease-out; }
  html.intro.pin .subtitle { opacity: 1; transition-delay: 0.4s; }
  html.intro.rewind .subtitle { transition-delay: 0.15s; }

  /* The list cascade: each row slides in from the right, its fade starting 150ms into the
     slide. --in and --out are that row's place in the queue — arriving, and leaving in the
     reverse order. visibility flips at the ends so a row is never a hit target early or an
     invisible one late. */
  html.intro .list-label, html.intro .acc { opacity: 0; transform: translateX(48px);
                                            visibility: hidden; }
  html.intro.pin .list-label, html.intro.pin .acc {
    opacity: 1; transform: none; visibility: visible;
    transition: transform 0.35s ease-out var(--in),
                opacity 0.2s ease-out calc(var(--in) + 0.15s),
                visibility 0s linear var(--in); }
  html.intro.rewind .list-label, html.intro.rewind .acc {
    transition: transform 0.28s ease-in var(--out),
                opacity 0.2s ease-in var(--out),
                visibility 0s linear calc(var(--out) + 0.28s); }
  html.intro .list-label           { --in: 0.50s; --out: 0.50s; }
  html.intro .acc:nth-of-type(1)   { --in: 0.60s; --out: 0.40s; }
  html.intro .acc:nth-of-type(2)   { --in: 0.75s; --out: 0.30s; }
  html.intro .acc:nth-of-type(3)   { --in: 0.90s; --out: 0.20s; }
  html.intro .acc:nth-of-type(4)   { --in: 1.05s; --out: 0.10s; }
  html.intro .acc:nth-of-type(n+5) { --in: 1.20s; --out: 0s; }
  @media (prefers-reduced-motion: no-preference) {
    .acc-panel, .acc-tilt, .acc-shield { will-change: transform, opacity; }
  }

  /* the terminal line */
  .site-header h1.term { font-family: var(--font-label); font-weight: 400;
                         font-size: clamp(15px, 5vw, 24px); letter-spacing: 0.02em; text-transform: none; }
  .type-cursor { display: inline-block; margin-left: 3px; color: var(--accent);
                 font-family: var(--font-label); font-weight: 500;
                 animation: cursor-blink 1.06s steps(1) infinite; }
  @keyframes cursor-blink { 50% { opacity: 0; } }

  /* the replay control — injected into the header by site/js/intro.js, faded in once the
     intro has settled. Hidden means visibility: hidden too, so it leaves the tab order. */
  .replay { position: absolute; top: 14px; right: 26px; width: 34px; height: 34px;
            padding: 5px; background: none; border: 0; border-radius: 999px;
            color: var(--muted); cursor: pointer;
            opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, color 0.2s ease, visibility 0s linear 0.5s; }
  .replay.on { opacity: 1; visibility: visible;
               transition: opacity 0.5s ease, color 0.2s ease, visibility 0s; }
  .replay:hover, .replay:focus-visible { color: var(--accent); }
  .replay svg { display: block; width: 100%; height: 100%; }
  /* The one responsive rule that can't live in the block above: these declarations would
     lose to the equally specific ones here, which the cascade reaches later. Same sm
     breakpoint — the header's padding tightens, and a finger needs a bigger target. */
  @media (max-width: 639px) {
    .replay { top: 6px; right: 8px; width: 44px; height: 44px; padding: 10px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <h1>{{brand}}</h1>
    {{subtitle}}
  </div>
</header>

<main>
{{content}}
</main>

<script>
  (function () {
    "use strict";
    document.documentElement.classList.add("js");
    var accs = Array.prototype.slice.call(document.querySelectorAll(".acc:not(.ext)"));
    if (!accs.length && !document.querySelector(".acc")) return;

    var root = document.documentElement;
    var header = document.querySelector(".site-header");
    var motionOK = !matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* The cold-open lives in site/js/intro.js. It talks to this script through two events:
       "prajno:replay" (about to rewind the page — collapse anything a reader opened) and
       "prajno:settled" (the header is at its final size, so the measurements below hold). */

    function measure() {
      root.style.setProperty("--header-h", header.offsetHeight + "px");
      accs.forEach(function (acc) {
        acc.style.setProperty("--bar-h", acc.querySelector(".acc-bar").offsetHeight + "px");
      });
    }
    measure();
    addEventListener("resize", measure);
    // During the intro the header wears the smaller terminal face, so the height measured
    // above is short-lived; re-measure once the real wordmark is back in place.
    addEventListener("prajno:settled", measure);

    function setOpen(acc, open) {
      acc.classList.toggle("open", open);
      acc.querySelectorAll(".acc-toggle, .chev").forEach(function (b) {
        b.setAttribute("aria-expanded", String(open));
      });
      // A collapsed peek shouldn't be tabbable underneath the shield.
      acc.querySelector("iframe").tabIndex = open ? 0 : -1;
    }
    function collapseAll() {
      accs.forEach(function (a) { setOpen(a, false); });
    }
    // A replay rewinds the whole page; an article a reader expanded shouldn't ride along.
    addEventListener("prajno:replay", collapseAll);
    // One expanded at a time: expanding an accordion collapses the others, then pins its
    // bar just under the sticky header so the panel takes over the rest of the viewport.
    function expand(acc) {
      accs.forEach(function (a) { setOpen(a, a === acc); });
      function align(behavior) {
        if (!acc.classList.contains("open")) return; // collapsed again before we settled
        var y = acc.getBoundingClientRect().top + window.scrollY - header.offsetHeight;
        window.scrollTo({ top: y, behavior: behavior });
      }
      requestAnimationFrame(function () { align(motionOK ? "smooth" : "auto"); });
      // Panels above may still be collapsing while we scroll; settle once they're done.
      setTimeout(function () { align("auto"); }, 420);
    }

    // True if the hit element sits in fixed-position chrome (e.g. the article's floating
    // theme button) — forwarding a "please expand" click into those would flip state the
    // reader never asked for.
    function inFixedChrome(el, win) {
      for (var node = el; node && node.nodeType === 1; node = node.parentElement) {
        if (win.getComputedStyle(node).position === "fixed") return true;
      }
      return false;
    }

    accs.forEach(function (acc) {
      var iframe = acc.querySelector("iframe");
      iframe.tabIndex = -1;
      // Esc must also work when focus is INSIDE the article iframe.
      iframe.addEventListener("load", function () {
        try {
          iframe.contentWindow.addEventListener("keydown", function (event) {
            if (event.key === "Escape") collapseAll();
          });
        } catch (e) { /* cross-origin — parent listener still covers the rest */ }
      });
      function toggle() {
        if (acc.classList.contains("open")) setOpen(acc, false);
        else expand(acc);
      }
      acc.querySelector(".acc-toggle").addEventListener("click", toggle);
      acc.querySelector(".chev").addEventListener("click", toggle);
      // Collapsed, the shield catches the click: expand FIRST, then forward the same
      // click into the iframe (same-origin) so e.g. a tap on the article's rail nav
      // still lands where the reader aimed.
      acc.querySelector(".acc-shield").addEventListener("click", function (event) {
        var rect = iframe.getBoundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;
        expand(acc);
        try {
          var doc = iframe.contentDocument;
          var el = doc && doc.elementFromPoint(x, y);
          if (el && !inFixedChrome(el, iframe.contentWindow)) el.click();
        } catch (e) { /* cross-origin or not yet loaded — expanding is enough */ }
      });
    });

    addEventListener("keydown", function (event) {
      if (event.key === "Escape") collapseAll();
    });
  })();
</script>

<script>
  /* GoatCounter (#3): don't count a pageview when this page is only peeking inside a
     home-page accordion iframe — count real, top-level visits. */
  if (window.self !== window.top) window.goatcounter = { no_onload: true };
</script>
<script data-goatcounter="https://prajno.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
