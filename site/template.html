<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{meta}}
<style>
  /* Full-bleed sections below use 100vw, which includes the scrollbar gutter on systems
     with classic scrollbars — clip the few phantom pixels instead of panning sideways. */
  body { max-width: 700px; margin: 0 auto 40px; padding: 0 20px; font-family: Georgia, serif;
         font-size: 19px; line-height: 1.6; color: #1a1a1a; background: #ffffff;
         overflow-x: hidden; }
  h1 { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 38px; line-height: 1.15; margin: 0 0 4px; }
  .subtitle { color: #6b6b6b; font-size: 22px; margin-top: 0; }
  h2 { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 26px; margin-top: 44px; }
  blockquote { border-left: 3px solid #1a1a1a; margin-left: 0; padding-left: 20px; font-style: italic; }
  blockquote p { margin: 0; }
  figure { margin: 32px 0; }
  img { max-width: 100%; border-radius: 6px; }
  figcaption { font-size: 14px; color: #6b6b6b; text-align: center; margin-top: 8px;
               font-family: -apple-system, "Segoe UI", sans-serif; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 16px; background: #f2f2f2; padding: 1px 5px; border-radius: 4px; }

  /* The pinned header: full-bleed bar, content aligned to the text column. */
  .site-header { position: sticky; top: 0; z-index: 50;
                 width: 100vw; margin-left: calc(50% - 50vw);
                 background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(6px);
                 border-bottom: 1px solid #e8e8e8; }
  .site-header .inner { max-width: 700px; margin: 0 auto; padding: 18px 20px 14px; }
  .site-header h1 { font-size: 28px; margin: 0; }
  .site-header .subtitle { font-size: 16px; margin: 2px 0 0; }

  /* Home-page article accordions: full-bleed; collapsed shows a fixed-height peek of the
     article page in an iframe, expanded takes over the viewport below the pinned header. */
  .articles { width: 100vw; margin-left: calc(50% - 50vw); }
  .acc { border-bottom: 1px solid #e0e0e0; }
  .acc-bar { display: flex; align-items: center; gap: 14px;
             max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .acc-toggle { flex: 1; text-align: left; background: none; border: 0; cursor: pointer;
                padding: 20px 0; font: inherit; color: inherit; }
  .acc-title { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600;
               border-bottom: 2px solid #e0e0e0; }
  .acc-toggle:hover .acc-title { border-bottom-color: #1a1a1a; }
  .acc-meta { display: block; font-family: -apple-system, "Segoe UI", sans-serif;
              font-size: 14px; color: #6b6b6b; margin-top: 6px; }
  .acc-open { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 20px;
              color: #6b6b6b; text-decoration: none; padding: 8px 10px; border-radius: 6px; }
  .acc-open:hover { color: #1a1a1a; background: #f2f2f2; }
  .acc-panel { position: relative; height: 380px; overflow: hidden;
               transition: height 0.35s ease; border-top: 1px solid #e8e8e8; }
  .acc.open .acc-panel { height: calc(100vh - var(--header-h, 92px) - var(--bar-h, 86px));
                         height: calc(100dvh - var(--header-h, 92px) - var(--bar-h, 86px)); }
  .acc-panel iframe { display: block; width: 100%; height: 100%; border: 0; background: #141021; }
  /* The shield only earns its "click to expand" promise when scripts run. */
  .acc-shield { display: none; }
  html.js .acc-shield { position: absolute; inset: 0; cursor: pointer;
                display: flex; align-items: flex-end; justify-content: center;
                background: linear-gradient(to bottom, transparent 45%, rgba(20, 16, 33, 0.6)); }
  .acc-shield span { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
                     letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.85);
                     background: rgba(20, 16, 33, 0.75); border: 1px solid rgba(255, 255, 255, 0.25);
                     border-radius: 999px; padding: 6px 14px; margin-bottom: 16px; }
  .acc.open .acc-shield { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .acc-panel { transition: none; }
  }

  /* Home-page article listing (plain fallback while scripts are off) */
  .articles time { font-family: -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <h1>{{title}}</h1>
    {{subtitle}}
  </div>
</header>

<main>
{{content}}
</main>

<script>
  (function () {
    "use strict";
    document.documentElement.classList.add("js");
    var accs = Array.prototype.slice.call(document.querySelectorAll(".acc"));
    if (!accs.length) return;

    var root = document.documentElement;
    var header = document.querySelector(".site-header");
    var motionOK = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    function measure() {
      root.style.setProperty("--header-h", header.offsetHeight + "px");
      accs.forEach(function (acc) {
        acc.style.setProperty("--bar-h", acc.querySelector(".acc-bar").offsetHeight + "px");
      });
    }
    measure();
    addEventListener("resize", measure);

    function setOpen(acc, open) {
      acc.classList.toggle("open", open);
      acc.querySelector(".acc-toggle").setAttribute("aria-expanded", String(open));
      // A collapsed peek shouldn't be tabbable underneath the shield.
      acc.querySelector("iframe").tabIndex = open ? 0 : -1;
    }
    function collapseAll() {
      accs.forEach(function (a) { setOpen(a, false); });
    }
    // One expanded at a time: expanding an accordion collapses the others, then pins its
    // bar just under the sticky header so the panel takes over the rest of the viewport.
    function expand(acc) {
      accs.forEach(function (a) { setOpen(a, a === acc); });
      function align(behavior) {
        if (!acc.classList.contains("open")) return; // collapsed again before we settled
        var y = acc.getBoundingClientRect().top + window.scrollY - header.offsetHeight;
        window.scrollTo({ top: y, behavior: behavior });
      }
      requestAnimationFrame(function () { align(motionOK ? "smooth" : "auto"); });
      // Panels above may still be collapsing while we scroll; settle once they're done.
      setTimeout(function () { align("auto"); }, 420);
    }

    // True if the hit element sits in fixed-position chrome (e.g. the article's floating
    // theme button) — forwarding a "please expand" click into those would flip state the
    // reader never asked for.
    function inFixedChrome(el, win) {
      for (var node = el; node && node.nodeType === 1; node = node.parentElement) {
        if (win.getComputedStyle(node).position === "fixed") return true;
      }
      return false;
    }

    accs.forEach(function (acc) {
      var iframe = acc.querySelector("iframe");
      iframe.tabIndex = -1;
      // Esc must also work when focus is INSIDE the article iframe.
      iframe.addEventListener("load", function () {
        try {
          iframe.contentWindow.addEventListener("keydown", function (event) {
            if (event.key === "Escape") collapseAll();
          });
        } catch (e) { /* cross-origin — parent listener still covers the rest */ }
      });
      acc.querySelector(".acc-toggle").addEventListener("click", function () {
        if (acc.classList.contains("open")) setOpen(acc, false);
        else expand(acc);
      });
      // Collapsed, the shield catches the click: expand FIRST, then forward the same
      // click into the iframe (same-origin) so e.g. a tap on the article's rail nav
      // still lands where the reader aimed.
      acc.querySelector(".acc-shield").addEventListener("click", function (event) {
        var rect = iframe.getBoundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;
        expand(acc);
        try {
          var doc = iframe.contentDocument;
          var el = doc && doc.elementFromPoint(x, y);
          if (el && !inFixedChrome(el, iframe.contentWindow)) el.click();
        } catch (e) { /* cross-origin or not yet loaded — expanding is enough */ }
      });
    });

    addEventListener("keydown", function (event) {
      if (event.key === "Escape") collapseAll();
    });
  })();
</script>
</body>
</html>
