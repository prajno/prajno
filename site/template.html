<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{meta}}
<style>
  body { max-width: 700px; margin: 40px auto; padding: 0 20px; font-family: Georgia, serif;
         font-size: 19px; line-height: 1.6; color: #1a1a1a; }
  h1 { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 38px; line-height: 1.15; margin-bottom: 4px; }
  .subtitle { color: #6b6b6b; font-size: 22px; margin-top: 0; }
  h2 { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 26px; margin-top: 44px; }
  blockquote { border-left: 3px solid #1a1a1a; margin-left: 0; padding-left: 20px; font-style: italic; }
  blockquote p { margin: 0; }
  figure { margin: 32px 0; }
  img { max-width: 100%; border-radius: 6px; }
  figcaption { font-size: 14px; color: #6b6b6b; text-align: center; margin-top: 8px;
               font-family: -apple-system, "Segoe UI", sans-serif; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 16px; background: #f2f2f2; padding: 1px 5px; border-radius: 4px; }
  /* Home-page article listing */
  .articles { list-style: none; padding: 0; }
  .articles li { margin: 28px 0; }
  .articles a { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 22px;
                color: #1a1a1a; text-decoration: none; border-bottom: 2px solid #e0e0e0; }
  .articles a:hover { border-bottom-color: #1a1a1a; }
  .articles .summary { color: #6b6b6b; margin: 4px 0 0; }
  .articles time { display: block; font-family: -apple-system, "Segoe UI", sans-serif;
                   font-size: 14px; color: #8b8b8b; margin-top: 4px; }
</style>
</head>
<body>

<h1>{{title}}</h1>
{{subtitle}}

{{content}}
</body>
</html>
